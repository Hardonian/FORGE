apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forge-api-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "forge-api-service"
spec:
  rules:
    - host: forge.ai-hardware.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: forge-api-service
                port:
                  number: 80
