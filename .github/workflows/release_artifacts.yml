name: Release Binaries & Cloud Container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build Standalone Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: forge-linux-x64
            binary_path: dist/forge/forge
          - os: windows-latest
            artifact_name: forge-windows-x64
            binary_path: dist/forge/forge.exe
          - os: macos-latest
            artifact_name: forge-macos-arm64
            binary_path: dist/forge/forge

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build Standalone Binary
        run: |
          python scripts/build_standalone_binary.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip
          retention-days: 14

  build-docker:
    name: Build & Push Production Docker Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Export to Docker for Smoke Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: forge-inverse-design:test

      - name: Test Container Health Check & CLI
        run: |
          docker run --rm forge-inverse-design:test --version
          docker run --rm forge-inverse-design:test demo --out /app/runs/test

      - name: Build and Push Production Container
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

